<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QVPN Quantum Secured</title>
    <script type="text/javascript" src="/eel.js"></script>
    <style>
        :root {
            --bg-ultra-dark: #000000;
            --bg-dark: #0a0a0a;
            --panel-bg: #111111;
            --text-main: #fcfcfc;
            --text-muted: #888888;
            --accent-purple: #9333ea;
            --status-green: #10b981;
            --status-red: #ef4444;
            --button-size: 200px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-ultra-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circular-btn {
            width: var(--button-size);
            height: var(--button-size);
            border-radius: 50%;
            background-color: var(--bg-dark);
            border: 4px solid var(--accent-purple);
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.4);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .circular-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(147, 51, 234, 0.7);
        }

        .circular-btn:active {
            transform: scale(0.98);
        }

        .btn-text-main {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
        }

        .btn-text-status {
            font-size: 14px;
            color: var(--accent-purple);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .circular-btn.connected {
            border-color: var(--status-green);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.5);
        }

        .circular-btn.connected .btn-text-status {
            color: var(--status-green);
        }

        .bottom-section {
            flex: 1;
            background-color: var(--panel-bg);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .stats-dashboard {
            width: 100%;
            max-width: 800px;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            color: var(--accent-purple);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 16px;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .stat-card {
            background-color: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid transparent;
            transition: border-color 0.3s ease;
        }

        .stat-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            color: var(--text-main);
        }

        /* Heartbeat Pulse Animation */
        .pulse {
            animation: pulse-animation 1s ease-out;
            color: var(--status-green) !important;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); text-shadow: none; }
            50% { transform: scale(1.1); text-shadow: 0 0 15px var(--status-green); }
            100% { transform: scale(1); text-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="top-section">
        <div id="connectionBtn" class="circular-btn" onclick="toggleTunnel()">
            <div id="btnMainText" class="btn-text-main">CONNECT</div>
            <div id="btnStatusText" class="btn-text-status">Quantum Tunnel</div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="stats-dashboard">
            <div class="dashboard-header">Secure Tunnel Metrics</div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Session Time</div>
                    <div class="stat-value" id="uptime">00:00:00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Tx Pkts</div>
                    <div class="stat-value" id="pktsSent">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Rx Pkts</div>
                    <div class="stat-value" id="pktsRecv">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Heartbeat</div>
                    <div class="stat-value" id="heartbeat">WAITING</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const connectionBtn = document.getElementById('connectionBtn');
        const btnMainText = document.getElementById('btnMainText');
        const btnStatusText = document.getElementById('btnStatusText');
        const uptimeEl = document.getElementById('uptime');
        const pktsSentEl = document.getElementById('pktsSent');
        const pktsRecvEl = document.getElementById('pktsRecv');
        const heartbeatEl = document.getElementById('heartbeat');

        let isConnected = false;
        let uptimeSeconds = 0;
        let timerInterval;

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // --- STEP 1: Sending commands TO Python ---
        function toggleTunnel() {
            if (!isConnected) {
                // Call the Python function we will expose later
                eel.start_vpn_connection()(); 
            } else {
                eel.stop_vpn_connection()();
            }
        }

        // --- STEP 2: Receiving commands FROM Python ---
        // Eel allows Python to call these JavaScript functions directly
        eel.expose(update_ui_state);
        function update_ui_state(connected_state) {
            isConnected = connected_state;
            
            if (isConnected) {
                connectionBtn.classList.add('connected');
                btnMainText.textContent = "SECURE";
                btnStatusText.textContent = "Click to Disconnect";
                
                timerInterval = setInterval(() => {
                    uptimeSeconds++;
                    uptimeEl.innerText = formatTime(uptimeSeconds);
                }, 1000);
            } else {
                connectionBtn.classList.remove('connected');
                btnMainText.textContent = "CONNECT";
                btnStatusText.textContent = "Quantum Tunnel";
                clearInterval(timerInterval);
                uptimeSeconds = 0;
                uptimeEl.innerText = "00:00:00";
            }
        }

        eel.expose(update_metrics);
        function update_metrics(sent, recv) {
            pktsSentEl.innerText = sent;
            pktsRecvEl.innerText = recv;
        }

        // Function called by Python every 5 seconds
        eel.expose(trigger_heartbeat);
        function trigger_heartbeat() {
            heartbeatEl.innerText = "PING/PONG";
            
            // Trigger the CSS pulse animation
            heartbeatEl.classList.remove('pulse');
            void heartbeatEl.offsetWidth; // Trigger reflow
            heartbeatEl.classList.add('pulse');
            
            setTimeout(() => {
                if (isConnected) heartbeatEl.innerText = "OK";
            }, 1000);
        }
    </script>
</body>
</html>
