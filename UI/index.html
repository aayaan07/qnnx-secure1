<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QVPN — Quantum Secured</title>
    <script type="text/javascript" src="/eel.js"></script>
    <style>
        :root {
            --bg:           #080b12;
            --surface:      #0f1420;
            --surface-2:    #161c2d;
            --border:       rgba(255,255,255,0.07);
            --text:         #e8eaf0;
            --text-muted:   #5a6278;
            --text-dim:     #8b93a8;

            --purple:       #7c3aed;
            --purple-glow:  rgba(124, 58, 237, 0.35);
            --purple-soft:  rgba(124, 58, 237, 0.12);

            --green:        #10b981;
            --green-glow:   rgba(16, 185, 129, 0.35);
            --green-soft:   rgba(16, 185, 129, 0.1);

            --amber:        #f59e0b;
            --amber-glow:   rgba(245, 158, 11, 0.35);
            --amber-soft:   rgba(245, 158, 11, 0.1);

            --red:          #ef4444;
            --red-glow:     rgba(239, 68, 68, 0.35);
            --red-soft:     rgba(239, 68, 68, 0.1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* ── Layout ── */
        .app {
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--text);
        }

        .logo-text span {
            color: var(--purple);
        }

        .header-badge {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px 10px;
            text-transform: uppercase;
        }

        /* ── Main ── */
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 36px;
            padding: 24px;
            overflow: hidden;
        }

        /* ── Connection button ── */
        .btn-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Outer animated ring */
        .btn-ring {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: border-color 0.4s, box-shadow 0.4s;
            pointer-events: none;
        }

        /* Second, slower ring */
        .btn-ring-2 {
            position: absolute;
            width: 204px;
            height: 204px;
            border-radius: 50%;
            border: 1px solid transparent;
            transition: border-color 0.4s, box-shadow 0.4s;
            pointer-events: none;
        }

        .power-btn {
            position: relative;
            z-index: 1;
            width: 156px;
            height: 156px;
            border-radius: 50%;
            background: var(--surface);
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.2s, background 0.4s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .power-btn:hover {
            transform: scale(1.04);
        }

        .power-btn:active {
            transform: scale(0.97);
        }

        .power-icon {
            width: 40px;
            height: 40px;
            transition: color 0.4s;
            color: var(--text-muted);
        }

        .btn-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: color 0.4s;
        }

        /* ── Button states ── */

        /* disconnected — default, purple ring */
        .app[data-state="disconnected"] .btn-ring {
            border-color: rgba(124,58,237,0.25);
        }
        .app[data-state="disconnected"] .btn-ring-2 {
            border-color: rgba(124,58,237,0.1);
        }
        .app[data-state="disconnected"] .power-icon { color: var(--purple); }
        .app[data-state="disconnected"] .btn-label  { color: var(--purple); }

        /* connecting — amber pulsing */
        .app[data-state="connecting"] .btn-ring {
            border-color: var(--amber);
            box-shadow: 0 0 0 0 var(--amber-glow);
            animation: ring-pulse-amber 1.4s ease-out infinite;
        }
        .app[data-state="connecting"] .btn-ring-2 {
            border-color: rgba(245,158,11,0.15);
            animation: ring-pulse-amber-2 1.4s ease-out infinite;
        }
        .app[data-state="connecting"] .power-icon { color: var(--amber); }
        .app[data-state="connecting"] .btn-label  { color: var(--amber); }
        .app[data-state="connecting"] .power-btn  { cursor: default; }

        /* active — green */
        .app[data-state="active"] .btn-ring {
            border-color: var(--green);
            box-shadow: 0 0 28px var(--green-glow);
        }
        .app[data-state="active"] .btn-ring-2 {
            border-color: rgba(16,185,129,0.2);
            box-shadow: 0 0 48px var(--green-glow);
        }
        .app[data-state="active"] .power-btn {
            background: var(--green-soft);
        }
        .app[data-state="active"] .power-icon { color: var(--green); }
        .app[data-state="active"] .btn-label  { color: var(--green); }

        /* disconnecting — amber, no pulse */
        .app[data-state="disconnecting"] .btn-ring {
            border-color: var(--amber);
            box-shadow: 0 0 20px var(--amber-glow);
            animation: ring-pulse-amber 1.4s ease-out infinite;
        }
        .app[data-state="disconnecting"] .btn-ring-2 {
            border-color: rgba(245,158,11,0.15);
        }
        .app[data-state="disconnecting"] .power-icon { color: var(--amber); }
        .app[data-state="disconnecting"] .btn-label  { color: var(--amber); }
        .app[data-state="disconnecting"] .power-btn  { cursor: default; }

        /* error — red */
        .app[data-state="error"] .btn-ring {
            border-color: var(--red);
            box-shadow: 0 0 24px var(--red-glow);
        }
        .app[data-state="error"] .btn-ring-2 {
            border-color: rgba(239,68,68,0.15);
        }
        .app[data-state="error"] .power-btn {
            background: var(--red-soft);
        }
        .app[data-state="error"] .power-icon { color: var(--red); }
        .app[data-state="error"] .btn-label  { color: var(--red); }

        @keyframes ring-pulse-amber {
            0%   { box-shadow: 0 0 0  0   var(--amber-glow); }
            60%  { box-shadow: 0 0 24px 8px var(--amber-glow); }
            100% { box-shadow: 0 0 0  0   var(--amber-glow); }
        }
        @keyframes ring-pulse-amber-2 {
            0%   { transform: scale(1);    opacity: 0.4; }
            60%  { transform: scale(1.05); opacity: 0.15; }
            100% { transform: scale(1);    opacity: 0.4; }
        }

        /* Spinner (inside button for connecting / disconnecting) */
        .btn-spinner {
            position: absolute;
            width: 156px;
            height: 156px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--amber);
            animation: spin 0.9s linear infinite;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .app[data-state="connecting"]    .btn-spinner,
        .app[data-state="disconnecting"] .btn-spinner {
            opacity: 1;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Status pill ── */
        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: all 0.4s;
            min-width: 160px;
            justify-content: center;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
            transition: background 0.4s;
        }

        .app[data-state="active"] .status-pill {
            color: var(--green);
            border-color: rgba(16,185,129,0.3);
            background: var(--green-soft);
        }
        .app[data-state="active"] .status-dot {
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            animation: dot-blink 2s ease-in-out infinite;
        }

        .app[data-state="connecting"] .status-pill,
        .app[data-state="disconnecting"] .status-pill {
            color: var(--amber);
            border-color: rgba(245,158,11,0.3);
            background: var(--amber-soft);
        }
        .app[data-state="connecting"] .status-dot,
        .app[data-state="disconnecting"] .status-dot {
            background: var(--amber);
            animation: dot-blink 0.8s ease-in-out infinite;
        }

        .app[data-state="error"] .status-pill {
            color: var(--red);
            border-color: rgba(239,68,68,0.3);
            background: var(--red-soft);
        }
        .app[data-state="error"] .status-dot {
            background: var(--red);
        }

        @keyframes dot-blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        /* ── Stats grid ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 540px;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 10px;
            text-align: center;
            transition: border-color 0.4s;
        }

        .stat-label {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-val {
            font-size: 16px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-dim);
            letter-spacing: 0.03em;
            transition: color 0.3s;
        }

        .app[data-state="active"] .stat-val {
            color: var(--text);
        }

        /* heartbeat pulse */
        .stat-val.pulse {
            animation: val-pulse 0.6s ease-out;
        }

        @keyframes val-pulse {
            0%   { color: var(--green); transform: scale(1.08); }
            100% { color: var(--text); transform: scale(1); }
        }

        /* ── Footer ── */
        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }

        .footer-left {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.06em;
        }

        .enc-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }

        .enc-badge svg {
            width: 12px;
            height: 12px;
            color: var(--purple);
        }

        /* ── Toast notifications ── */
        .toast-area {
            position: fixed;
            bottom: 52px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 100;
            pointer-events: none;
        }

        .toast {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            border: 1px solid;
            animation: toast-in 0.3s ease, toast-out 0.3s ease 2.7s forwards;
            white-space: nowrap;
        }

        .toast.info    { background: var(--surface-2); border-color: var(--border); color: var(--text-dim); }
        .toast.success { background: var(--green-soft); border-color: rgba(16,185,129,0.4); color: var(--green); }
        .toast.warn    { background: var(--amber-soft); border-color: rgba(245,158,11,0.4); color: var(--amber); }
        .toast.error   { background: var(--red-soft);   border-color: rgba(239,68,68,0.4);  color: var(--red); }

        @keyframes toast-in  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
        @keyframes toast-out { from { opacity:1; } to { opacity:0; } }

        /* ── Settings gear ── */
        .gear-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .gear-btn:hover { color: var(--text); }
        .gear-btn svg { width: 18px; height: 18px; }
        .header-right { display: flex; align-items: center; gap: 12px; }

        /* ── Setup modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 6, 12, 0.82);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 26px 26px 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.03em;
            margin-bottom: 4px;
        }
        .modal-sub {
            font-size: 11.5px;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .device-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--purple-soft);
            border: 1px solid rgba(124,58,237,0.3);
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 12px;
            color: var(--text);
            margin-bottom: 20px;
        }
        .device-chip b { color: var(--purple); font-weight: 700; }

        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 12.5px;
            font-family: 'Consolas', 'Courier New', monospace;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus { border-color: var(--purple); }

        .modal-error {
            display: none;
            background: var(--red-soft);
            border: 1px solid rgba(239,68,68,0.4);
            color: var(--red);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 11.5px;
            line-height: 1.45;
            margin-bottom: 14px;
        }
        .modal-error.show { display: block; }

        .modal-actions { display: flex; gap: 10px; margin-top: 6px; }

        .btn-primary {
            flex: 1;
            background: var(--purple);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: opacity 0.2s, background 0.2s;
        }
        .btn-primary:hover { background: #8b4ff0; }
        .btn-primary:disabled { opacity: 0.55; cursor: default; }

        .btn-ghost {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 8px;
            padding: 11px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        .btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }

        /* ── Responsive ── */
        @media (max-height: 540px) {
            .power-btn  { width: 120px; height: 120px; }
            .btn-ring   { width: 140px; height: 140px; }
            .btn-ring-2 { width: 160px; height: 160px; }
            .btn-spinner{ width: 120px; height: 120px; }
            .power-icon { width: 32px; height: 32px; }
            .main { gap: 20px; }
        }

        @media (max-width: 380px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .header { padding: 12px 16px; }
            .footer { padding: 10px 16px; }
        }
    </style>
</head>
<body>

<div class="app" id="app" data-state="disconnected">

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <svg class="logo-icon" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="13" stroke="#7c3aed" stroke-width="1.5" fill="none"/>
                <path d="M14 6 L14 22 M9 10 L14 6 L19 10" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <circle cx="14" cy="17" r="3" fill="#7c3aed" opacity="0.7"/>
            </svg>
            <span class="logo-text">Q<span>VPN</span></span>
        </div>
        <div class="header-right">
            <span class="header-badge">PQC Secured</span>
            <button class="gear-btn" id="settingsBtn" onclick="openSetup(true)" aria-label="Settings" title="Credentials">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main -->
    <main class="main">

        <!-- Big power button -->
        <div class="btn-wrap">
            <div class="btn-ring-2"></div>
            <div class="btn-ring"></div>
            <div class="btn-spinner"></div>
            <button class="power-btn" id="powerBtn" onclick="toggleTunnel()" aria-label="Toggle VPN">
                <!-- Power icon -->
                <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v7"/>
                    <path d="M5.64 5.64A9 9 0 1 0 18.36 5.64"/>
                </svg>
                <span class="btn-label" id="btnLabel">Connect</span>
            </button>
        </div>

        <!-- Status pill -->
        <div class="status-pill">
            <div class="status-dot"></div>
            <span id="statusText">Disconnected</span>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Uptime</div>
                <div class="stat-val" id="uptime">00:00:00</div>
            </div>
            <div class="stat">
                <div class="stat-label">Tx Pkts</div>
                <div class="stat-val" id="pktsSent">—</div>
            </div>
            <div class="stat">
                <div class="stat-label">Rx Pkts</div>
                <div class="stat-val" id="pktsRecv">—</div>
            </div>
            <div class="stat">
                <div class="stat-label">Heartbeat</div>
                <div class="stat-val" id="heartbeat">—</div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <span class="footer-left" id="footerMsg">Idle</span>
        <div class="enc-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            AES-256 · ML-KEM
        </div>
    </footer>

</div>

<!-- Setup / credentials modal -->
<div class="modal-overlay" id="setupOverlay">
    <div class="modal">
        <div class="modal-title" id="setupTitle">Set up QVPN</div>
        <div class="modal-sub">
            Enter your API credentials to activate this device. They are verified
            against the Gateway &amp; PQC services, then stored securely in Windows
            Credential Manager — never on disk.
        </div>

        <div class="device-chip">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
            </svg>
            Device ID:&nbsp;<b id="deviceId">…</b>
        </div>

        <div class="modal-error" id="setupError"></div>

        <div class="field">
            <label for="fGatewayKey">Gateway API Key</label>
            <input type="password" id="fGatewayKey" autocomplete="off" spellcheck="false" placeholder="qvpn_live_…">
        </div>
        <div class="field">
            <label for="fPqcKey">PQC API Key</label>
            <input type="password" id="fPqcKey" autocomplete="off" spellcheck="false" placeholder="qnnx_…">
        </div>
        <div class="field">
            <label for="fPqcSecret">PQC Signing Secret</label>
            <input type="password" id="fPqcSecret" autocomplete="off" spellcheck="false" placeholder="qnnxsig_…">
        </div>

        <div class="modal-actions">
            <button class="btn-ghost" id="setupCancelBtn" onclick="closeSetup()" style="display:none;">Cancel</button>
            <button class="btn-primary" id="setupSaveBtn" onclick="submitSetup()">Verify &amp; Save</button>
        </div>
    </div>
</div>

<!-- Toast container -->
<div class="toast-area" id="toastArea"></div>

<script>
    const app       = document.getElementById('app');
    const btnLabel  = document.getElementById('btnLabel');
    const statusText= document.getElementById('statusText');
    const uptimeEl  = document.getElementById('uptime');
    const pktsSentEl= document.getElementById('pktsSent');
    const pktsRecvEl= document.getElementById('pktsRecv');
    const heartbeatEl=document.getElementById('heartbeat');
    const footerMsg = document.getElementById('footerMsg');
    const toastArea = document.getElementById('toastArea');

    let currentState = 'disconnected';
    let uptimeSeconds = 0;
    let timerInterval = null;

    const STATE_LABELS = {
        disconnected:  'Connect',
        connecting:    'Connecting…',
        active:        'Disconnect',
        disconnecting: 'Disconnecting…',
        error:         'Retry',
    };

    const STATE_STATUS = {
        disconnected:  'Disconnected',
        connecting:    'Establishing Tunnel',
        active:        'Tunnel Active',
        disconnecting: 'Disconnecting',
        error:         'Connection Error',
    };

    const STATE_FOOTER = {
        disconnected:  'Idle — ready to connect',
        connecting:    'Performing PQC handshake…',
        active:        'Quantum tunnel active',
        disconnecting: 'Tearing down tunnel…',
        error:         'Error — click to retry',
    };

    function formatTime(s) {
        const h = Math.floor(s / 3600).toString().padStart(2, '0');
        const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
        const sec = (s % 60).toString().padStart(2, '0');
        return `${h}:${m}:${sec}`;
    }

    function toast(msg, type = 'info', duration = 3000) {
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.textContent = msg;
        toastArea.appendChild(el);
        setTimeout(() => el.remove(), duration);
    }

    function toggleTunnel() {
        if (currentState === 'connecting' || currentState === 'disconnecting') return;
        if (!isConfigured) {
            toast('Set up credentials first', 'warn');
            openSetup(false);
            return;
        }
        if (currentState === 'active') {
            eel.stop_vpn_connection()();
        } else {
            eel.start_vpn_connection()();
        }
    }

    // Called by Python
    eel.expose(update_ui_state);
    function update_ui_state(state) {
        const prev = currentState;
        currentState = state;

        app.dataset.state = state;
        btnLabel.textContent = STATE_LABELS[state] || state;
        statusText.textContent = STATE_STATUS[state] || state;
        footerMsg.textContent = STATE_FOOTER[state] || '';

        clearInterval(timerInterval);

        if (state === 'active') {
            if (prev !== 'active') {
                uptimeSeconds = 0;
                toast('Tunnel established', 'success');
            }
            timerInterval = setInterval(() => {
                uptimeSeconds++;
                uptimeEl.textContent = formatTime(uptimeSeconds);
            }, 1000);
        } else if (state === 'disconnected') {
            if (prev === 'active' || prev === 'disconnecting') {
                toast('Disconnected', 'info');
            }
            uptimeSeconds = 0;
            uptimeEl.textContent = '00:00:00';
            pktsSentEl.textContent = '—';
            pktsRecvEl.textContent = '—';
            heartbeatEl.textContent = '—';
        } else if (state === 'connecting') {
            toast('Connecting…', 'warn');
        } else if (state === 'error') {
            toast('Connection failed — click to retry', 'error');
        }
    }

    eel.expose(update_metrics);
    function update_metrics(sent, recv) {
        pktsSentEl.textContent = sent;
        pktsRecvEl.textContent = recv;
    }

    eel.expose(trigger_heartbeat);
    function trigger_heartbeat() {
        heartbeatEl.textContent = 'OK';
        heartbeatEl.classList.remove('pulse');
        void heartbeatEl.offsetWidth;
        heartbeatEl.classList.add('pulse');
        heartbeatEl.addEventListener('animationend', () => heartbeatEl.classList.remove('pulse'), { once: true });
    }

    // ── Setup / credentials modal ──────────────────────────────────────────
    const setupOverlay  = document.getElementById('setupOverlay');
    const setupError    = document.getElementById('setupError');
    const setupSaveBtn  = document.getElementById('setupSaveBtn');
    const setupCancelBtn= document.getElementById('setupCancelBtn');
    const setupTitle    = document.getElementById('setupTitle');
    const deviceIdEl    = document.getElementById('deviceId');
    const fGatewayKey   = document.getElementById('fGatewayKey');
    const fPqcKey       = document.getElementById('fPqcKey');
    const fPqcSecret    = document.getElementById('fPqcSecret');

    let isConfigured = false;

    function showSetupError(msg) {
        setupError.textContent = msg;
        setupError.classList.add('show');
    }
    function hideSetupError() {
        setupError.classList.remove('show');
    }

    // firstRun=true means keyring is empty → cancel not allowed.
    // Called from the gear button (firstRun=false → cancel allowed).
    async function openSetup(fromSettings) {
        hideSetupError();
        const info = await eel.get_setup_info()();
        deviceIdEl.textContent = info.client_identifier;
        isConfigured = info.configured;

        setupTitle.textContent = isConfigured ? 'Update credentials' : 'Set up QVPN';
        // Only allow closing without saving if credentials already exist.
        setupCancelBtn.style.display = isConfigured ? 'inline-block' : 'none';

        fGatewayKey.value = '';
        fPqcKey.value = '';
        fPqcSecret.value = '';
        setupOverlay.classList.add('open');
        fGatewayKey.focus();
    }

    function closeSetup() {
        if (!isConfigured) return; // block closing on first run
        setupOverlay.classList.remove('open');
    }

    async function submitSetup() {
        hideSetupError();
        const gk = fGatewayKey.value.trim();
        const pk = fPqcKey.value.trim();
        const ps = fPqcSecret.value.trim();
        if (!gk || !pk || !ps) {
            showSetupError('All three fields are required.');
            return;
        }

        setupSaveBtn.disabled = true;
        setupSaveBtn.textContent = 'Verifying…';
        try {
            const res = await eel.submit_setup_credentials(gk, pk, ps)();
            if (res && res.ok) {
                isConfigured = true;
                setupOverlay.classList.remove('open');
                toast('Credentials saved securely', 'success');
            } else {
                showSetupError((res && res.error) || 'Verification failed.');
            }
        } catch (e) {
            showSetupError('Verification failed: ' + e);
        } finally {
            setupSaveBtn.disabled = false;
            setupSaveBtn.textContent = 'Verify & Save';
        }
    }

    // On launch: prompt for setup if not yet configured.
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const info = await eel.get_setup_info()();
            if (!info.configured) {
                openSetup(false);
            }
        } catch (e) {
            // If the bridge isn't ready, fail open (button will still guard).
            console.error('setup info failed', e);
        }
    });

</script>
</body>
</html>
